<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Redirigiendo a Contacto | Felix Place</title>

  <meta
    name="description"
    content="La página de sugerencias de Felix Place ahora se encuentra integrada en nuestra página de contacto."
  >

  <meta name="robots" content="noindex, follow">

  <link
    rel="canonical"
    href="https://felixplace.com/contacto.html"
  >

  <meta
    http-equiv="refresh"
    content="0; url=contacto.html"
  >

  <link
    rel="icon"
    type="image/png"
    href="assets/favicon.ico"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 30px;
      display: grid;
      place-items: center;
      background: #f4f8fb;
      color: #001f3f;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .redireccion {
      width: min(520px, 100%);
      padding: 40px 30px;
      border: 1px solid #dce8f0;
      border-radius: 18px;
      background: white;
      box-shadow: 0 12px 35px rgba(0, 31, 63, 0.08);
    }

    .redireccion img {
      width: 75px;
      height: 75px;
      margin-bottom: 18px;
      object-fit: contain;
    }

    .redireccion h1 {
      margin: 0 0 14px;
      font-size: 1.8rem;
    }

    .redireccion p {
      margin: 0 0 24px;
      color: #526171;
      line-height: 1.7;
    }

    .redireccion a {
      display: inline-block;
      padding: 13px 24px;
      border-radius: 8px;
      background: #001f3f;
      color: #00ffff;
      font-weight: 700;
      text-decoration: none;
    }

    .redireccion a:hover {
      background: #00335f;
    }
  </style>
</head>

<body>

  <main class="redireccion">
    <img
      src="assets/logo.png"
      alt="Logo de Felix Place"
    >

    <h1>Ahora estamos en Contacto</h1>

    <p>
      La sección de sugerencias fue integrada en nuestra página de
      contacto. Serás redirigido automáticamente.
    </p>

    <a href="contacto.html">
      Ir a Contacto
    </a>
  </main>

  <script>
    window.location.replace("contacto.html");
  </script>

</body>
</html>
